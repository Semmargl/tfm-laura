name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Doctor (offline)
        run: python tools/doctor.py --offline
      - name: Smoke test S1-S3 on a scratch copy
        run: |
          tmp=$(mktemp -d) && cp -R . "$tmp/p" && cd "$tmp/p"
          python .claude/skills/tfm-orchestrator/scripts/integrity.py check
          python .claude/skills/tfm-orchestrator/scripts/smoke_test.py --s1
      - name: Build Cowork package
        run: python tools/build_release.py
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TFM_Laura_instalacion_*.zip dist/skills/*.zip \
            --title "TFM Laura $GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag \
          || gh release upload "$GITHUB_REF_NAME" dist/TFM_Laura_instalacion_*.zip dist/skills/*.zip --clobber
